[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "intellipay"
version = "0.1.0"
description = "Controlled, agent-assisted invoice processing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "langgraph>=0.6,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "openai>=1.99,<3",
    "opencv-python-headless>=4.10,<5",
    "pypdfium2>=4.30,<5",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "rapidocr-onnxruntime>=1.4,<2",
    "uvicorn>=0.35,<1",
]

[project.scripts]
intellipay = "intellipay.cli:main"
intellipay-evaluate = "intellipay.evaluation:main"
intellipay-review = "intellipay.review_app:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<8", "ruff>=0.12,<1"]

[tool.uv]
exclude-dependencies = [
    { package = { name = "rapidocr-onnxruntime" }, dependencies = [
        "opencv-python",
    ] },
]

[tool.hatch.build.targets.wheel]
packages = ["src/intellipay"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["live: calls the real xAI API and requires XAI_API_KEY"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
