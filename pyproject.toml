[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "intellipay"
version = "0.1.0"
description = "Controlled, agent-assisted invoice processing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6,<2",
    "openai>=1.99,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
intellipay = "intellipay.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<8", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/intellipay"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["live: calls the real xAI API and requires XAI_API_KEY"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
